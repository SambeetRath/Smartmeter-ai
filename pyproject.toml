[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmeter-ai"
version = "0.1.0"
description = "SmartMeter AI — energy analytics and anomaly detection pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "joblib==1.6.0",
  "numpy==2.5.4",
  "pandas==3.1.0",
  "pyarrow==26.0.0",
  "pydantic==2.14.2",
  "scikit-learn==1.9.1",
  "SQLAlchemy==2.0.55",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]
dashboard = [
  "httpx==0.28.1",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
]
assistant-openai = [
  "openai>=1.66,<3",
]
assistant-ollama = [
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: tests requiring a dedicated PostgreSQL *_test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
