[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmeter-ai"
version = "0.1.0"
description = "SmartMeter AI — energy analytics and anomaly detection pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.1.0",
  "pyarrow==26.0.0",
  "pydantic==2.14.2",
  "fastapi==0.162.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
