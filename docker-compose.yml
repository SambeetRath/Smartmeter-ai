services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - smartmeter-db
    restart: unless-stopped

  ingest:
    build: .
    profiles: ["ingestion"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_PORT: "5432"
      SMARTMETER_DB_HOST: postgres
      SMARTMETER_PARQUET_PATH: /app/data/processed/household_power_consumption.parquet
      SMARTMETER_METER_IDENTIFIER: ${SMARTMETER_METER_IDENTIFIER:-uci_household_1}
      SMARTMETER_INGESTION_BATCH_SIZE: ${SMARTMETER_INGESTION_BATCH_SIZE:-5000}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartmeter-db
    command: ["python", "-m", "smartmeter.services.database_ingestion"]

  detection-worker:
    build: .
    profiles: ["detection"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_PORT: "5432"
      SMARTMETER_DB_HOST: postgres
      SMARTMETER_DETECTION_POLL_SECONDS: ${SMARTMETER_DETECTION_POLL_SECONDS:-2}
      SMARTMETER_DETECTION_LEASE_SECONDS: ${SMARTMETER_DETECTION_LEASE_SECONDS:-120}
      SMARTMETER_DETECTION_HEARTBEAT_SECONDS: ${SMARTMETER_DETECTION_HEARTBEAT_SECONDS:-20}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartmeter-db
    restart: unless-stopped
    command: ["python", "-m", "smartmeter.services.detection_worker"]

volumes:
  postgres_data:

networks:
  smartmeter-db:
    driver: bridge
